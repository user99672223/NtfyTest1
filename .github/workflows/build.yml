name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Stamp build info
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
          cat > Sources/BuildInfo.swift <<SWIFT
          enum BuildInfo {
              static let commit = "$COMMIT"
              static let date = "$DATE"
          }
          SWIFT

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: xcodebuild -project NtfyTest.xcodeproj -scheme NtfyTest -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build

      - name: Package IPA
        run: |
          cd build/Build/Products/Release-iphoneos
          mkdir Payload
          cp -R NtfyTest.app Payload/
          zip -qr NtfyTest-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: NtfyTest-unsigned-ipa
          path: build/Build/Products/Release-iphoneos/NtfyTest-unsigned.ipa
          retention-days: 14
