name: mac-gui
on: workflow_dispatch

jobs:
  gui:
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - name: Create VNC user
        env:
          PW: ${{ secrets.VNC_PASSWORD }}
        run: |
          sudo dscl . -create /Users/vncuser
          sudo dscl . -create /Users/vncuser UserShell /bin/zsh
          sudo dscl . -create /Users/vncuser RealName "VNC User"
          sudo dscl . -create /Users/vncuser UniqueID 1001
          sudo dscl . -create /Users/vncuser PrimaryGroupID 20
          sudo dscl . -create /Users/vncuser NFSHomeDirectory /Users/vncuser
          sudo dscl . -passwd /Users/vncuser "$PW"
          sudo dscl . -append /Groups/admin GroupMembership vncuser
          sudo createhomedir -c -u vncuser

      - name: Enable auto-login for vncuser
        env:
          PW: ${{ secrets.VNC_PASSWORD }}
        run: |
          sudo defaults write /Library/Preferences/com.apple.loginwindow autoLoginUser -string vncuser
          printf '%s' "$PW" | sudo tee /tmp/pw.txt >/dev/null
          sudo python3 - <<'EOF'
          key = [0x7D,0x89,0x52,0x23,0xD2,0xBC,0xDD,0xEA,0xA3,0xB9,0x1F]
          pw = open('/tmp/pw.txt','rb').read()
          n = max(12, ((len(pw) // 12) + 1) * 12)
          out = bytes(key[i % len(key)] ^ (pw[i] if i < len(pw) else 0) for i in range(n))
          open('/etc/kcpassword','wb').write(out)
          EOF
          sudo chmod 600 /etc/kcpassword
          sudo rm -f /tmp/pw.txt
          echo "auto-login configured"

      - name: Enable Screen Sharing
        run: |
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -restart -agent -privs -all -allowAccessFor -allUsers
          sudo launchctl enable system/com.apple.screensharing || true
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist || true
          sleep 3
          echo "--- listening on 5900? ---"
          sudo lsof -nP -iTCP:5900 -sTCP:LISTEN || echo "NOTHING LISTENING ON 5900"
          echo "--- current console user ---"
          stat -f '%Su' /dev/console

      - name: Tunnel port 5900
        env:
          NGROK_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          brew install ngrok
          ngrok config add-authtoken "$NGROK_TOKEN"
          nohup ngrok tcp 5900 --log stdout > /tmp/ngrok.log 2>&1 &
          sleep 10
          if ! curl -sf http://127.0.0.1:4040/api/tunnels; then
            echo "--- ngrok failed to start ---"
            cat /tmp/ngrok.log
            exit 1
          fi

      - name: Hold the session open
        run: sleep 21600
